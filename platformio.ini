; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
build_cache_dir = .cache
extra_configs = platformio.local.ini
description = EasySteel ESP32 target timing firmware (Clean Architecture & Event-driven)

; Common configuration for all physical ESP32 targets
[esp32_common]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

; COM-Port automatic range selection
upload_port = COM[1-9]
monitor_port = COM[1-9]

; Serial Monitor options
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	time
	colorize

; Upload options
upload_speed = 921600

; Build options
build_flags =
	-D CORE_DEBUG_LEVEL=3 ; Info level logging
	-I include/hardware
	-I include/network
	-I include/core
	-I src/hardware
	-I src/network
	-I src/core
lib_ldf_mode = chain ; Speeds up dependency resolution by skipping deep parsing

; Dependencies
lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SH110X@2.1.15
	bblanchon/ArduinoJson@7.4.3

; Static Code Analysis
check_tool = cppcheck
check_flags =
	--enable=warning,style,performance,portability
	--suppress=*:*libdeps*
check_skip_packages = yes

; Standard USB developer environment
[env:esp32dev]
extends = esp32_common

; Over-the-air flash environment
[env:esp32dev_ota]
extends = esp32_common
upload_protocol = espota

; Host-side unit testing environment (off-target Unity tests)
[env:native]
platform = native
platform_packages = toolchain-gccmingw32
; Native-test setup: use PlatformIO's MinGW toolchain and statically link test binaries.
extra_scripts = pre:test/extra_script.py
test_framework = unity
build_flags =
	-std=c++17
	-D UNIT_TEST
	-D FIXTURE_DIR="\"test/fixtures/protocol_v1/\""
	-I test/mocks
	-I include
	-I include/hardware
	-I include/network
	-I include/core
	-I src
	-I src/hardware
	-I src/network
	-I src/core
lib_deps =
	throwtheswitch/Unity@2.6.1
	bblanchon/ArduinoJson@7.4.3
